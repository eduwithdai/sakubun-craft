<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>さくぶんクラフト</title>
<meta name="description" content="書き出しブロックで、作文の世界をつくろう。小学1〜6年生向けの作文の書き出しアプリ。">
<meta name="theme-color" content="#6EB6EE">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="さくぶんクラフト">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,-apple-system,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&display=swap">
<style>
/* Layout: スタート画面（空と地面）→ HUD＋3つのタブ（もちもの／クラフトだい／わたしのせかい）。
   世界観：書き出し＝ことばブロック。ほる→あつめる→クラフトする→自分のせかいに積む。
   1つの世界に統一するため、ライト固定の単一テーマ。 */
:root{
  color-scheme:light;
  --sky1:#6EB6EE; --sky2:#86C5F3; --sky3:#A4D4F6;
  --grass:#5DAE3B; --grass-l:#7CCB55; --dirt:#8A5A33; --dirt-d:#6B4425;
  --stone:#C6C6C6; --stone-l:#FFFFFF; --stone-d:#555555; --slot:#8B8B8B; --slot-d:#373737;
  --ink:#232323; --ink-soft:#4A4A4A; --edge:#1D1D1D;
  --gold:#FFD43B; --green:#5DAE3B; --red:#C94040;
  --paper:#FBF7EC; --ruled:#D9D0BC;
  --f-pixel:"DotGothic16","Hiragino Maru Gothic ProN","Hiragino Sans","Noto Sans JP",monospace;
}
html,body{min-height:100%}
body{margin:0;background:var(--sky2);color:var(--ink);font-family:var(--f-pixel);font-size:17px;line-height:1.75;
  background-image:linear-gradient(var(--sky1) 0 220px,var(--sky2) 220px 520px,var(--sky3) 520px)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
svg{display:block}
.pixel{image-rendering:pixelated;shape-rendering:crispEdges}
rt{font-size:.5em;letter-spacing:0}

/* ---- 部品 ---- */
.btn{border:3px solid var(--edge);border-radius:0;padding:8px 16px;background:var(--stone);color:var(--ink);
  box-shadow:inset 3px 3px 0 rgba(255,255,255,.55),inset -3px -3px 0 rgba(0,0,0,.28);font-size:16px;line-height:1.4}
.btn:active,.btn[aria-pressed="true"]{box-shadow:inset 3px 3px 0 rgba(0,0,0,.28),inset -3px -3px 0 rgba(255,255,255,.4)}
.btn.green{background:var(--green);color:#fff;text-shadow:2px 2px 0 rgba(0,0,0,.35)}
.btn.gold{background:var(--gold);color:var(--ink)}
.btn[aria-pressed="true"]{background:#E8E8E8}
.btn.green[aria-pressed="true"]{background:#4A922D}
.btn:disabled{opacity:.5;cursor:not-allowed}
.panel{background:var(--stone);border:3px solid var(--edge);box-shadow:inset 3px 3px 0 var(--stone-l),inset -3px -3px 0 var(--stone-d);padding:14px 16px}
.slotbox{background:var(--slot);box-shadow:inset 3px 3px 0 var(--slot-d),inset -3px -3px 0 #fff}
.ttl{font-size:20px;margin:0 0 8px;color:var(--ink)}
.small{font-size:14px;color:var(--ink-soft)}

/* ---- スタート画面 ---- */
#start{position:relative;min-height:calc(100vh - 80px);min-height:calc(100svh - 80px);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;
  padding-block:40px 120px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));overflow:hidden;text-align:center}
.cloud{position:absolute;background:#fff;opacity:.9;box-shadow:16px -12px 0 #fff,32px 0 0 #fff;width:48px;height:20px;animation:drift 40s linear infinite}
@keyframes drift{from{transform:translateX(-30vw)}to{transform:translateX(130vw)}}
.floater{position:absolute;width:44px;height:44px;animation:bob 3s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-10px)}}
.logo{margin:0;font-size:clamp(32px,9.6vw,78px);white-space:nowrap;line-height:1.1;color:#fff;letter-spacing:.04em;font-weight:400;
  text-shadow:4px 4px 0 var(--dirt),8px 8px 0 var(--edge);position:relative;z-index:1}
.tag{margin:0;font-size:clamp(16px,3.6vw,20px);color:var(--ink);background:rgba(255,255,255,.75);padding:2px 12px;position:relative;z-index:1}
.gradebox{position:relative;z-index:1;width:min(460px,100%);box-sizing:border-box}
#grades{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
#grades .btn{padding:10px 0;font-size:18px}
@media (max-width:420px){#grades{grid-template-columns:repeat(3,1fr)}}
#startBtn{position:relative;z-index:1;font-size:26px;padding:12px 44px}
.blink{display:inline-block;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}
.ground{position:absolute;left:0;right:0;bottom:0;height:96px;
  background:linear-gradient(var(--grass-l) 0 8px,var(--grass) 8px 22px,var(--dirt) 22px);
  background-color:var(--dirt)}
.ground::before{content:"";position:absolute;inset:22px 0 0;background-image:
  linear-gradient(90deg,transparent 0 12px,var(--dirt-d) 12px 20px,transparent 20px 44px,var(--dirt-d) 44px 52px,transparent 52px);
  background-size:64px 24px;opacity:.6}
.ground::after{content:"";position:absolute;top:22px;left:0;right:0;height:8px;
  background:repeating-linear-gradient(90deg,var(--grass) 0 8px,transparent 8px 16px)}

/* ---- ゲーム画面 ---- */
#game{max-width:980px;margin:0 auto;padding-block:12px 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.hud{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hud .name{font-size:24px;color:#fff;text-shadow:3px 3px 0 var(--edge);margin-right:auto}
.hud .btn{font-size:14px;padding:6px 10px}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.tabs .btn{display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 6px;font-size:16px}
.tabs .btn svg{width:24px;height:24px}
@media (max-width:460px){.tabs .btn{flex-direction:column;gap:0;font-size:14px}}

.xp{display:grid;grid-template-columns:repeat(18,1fr);gap:3px;margin-top:6px}
.xp i{height:12px;background:var(--slot-d);border:2px solid var(--edge)}
.xp i.on{background:#7FE34A}
.invtop{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center}
@media (max-width:520px){.invtop{grid-template-columns:1fr}}
.inv{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.cell{border:0;padding:10px 6px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;min-width:0}
.cell svg{width:56px;height:56px;transition:transform .15s}
.cell:hover svg{transform:translateY(-3px) rotate(-4deg)}
.cell .nm{font-size:13px;line-height:1.35;color:#fff;text-shadow:2px 2px 0 var(--edge)}
.cell.off svg{filter:grayscale(1) brightness(.75);opacity:.6}
.cell.off .nm{color:#E0E0E0}

/* クラフトだい */
.hotbar{display:flex;gap:4px;overflow-x:auto;padding:4px;background:var(--slot-d);border:3px solid var(--edge)}
.hotbar button{flex:none;width:52px;height:52px;padding:4px;border:3px solid transparent;background:var(--slot)}
.hotbar button svg{width:100%;height:100%}
.hotbar button[aria-pressed="true"]{border-color:#fff;outline:3px solid var(--edge);outline-offset:-6px}
.curname{font-size:20px;color:#fff;text-shadow:2px 2px 0 var(--edge);margin:0}
.themes{display:flex;flex-wrap:wrap;gap:6px}
.themes .btn{font-size:14px;padding:5px 10px}
.craft{display:grid;grid-template-columns:1fr 48px 1fr;gap:10px;align-items:center}
.craft>*{min-width:0}
.arrow{width:48px;height:48px;margin:auto}
@media (max-width:760px){.craft{grid-template-columns:1fr}.arrow{transform:rotate(90deg)}}
.hints{margin:0 0 10px;padding-left:1.2em;font-size:15px}
.mat{display:flex;flex-direction:column;gap:10px}
.mat label{display:block;font-size:14px;margin-bottom:2px}
.mat input{width:100%;box-sizing:border-box;font:inherit;font-size:17px;padding:10px 12px;border:0;color:#fff;background:var(--slot);
  box-shadow:inset 3px 3px 0 var(--slot-d),inset -3px -3px 0 #fff;border-radius:0}
.mat input::placeholder{color:#E3E3E3}
.mat input:focus{outline:3px solid var(--gold);outline-offset:0}
.gtools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.gtools .sp{flex:1}
.gtools .btn{font-size:14px;padding:4px 10px}
.genko{font-family:"Klee One","Hiragino Mincho ProN",serif;background:var(--paper);border:3px solid var(--edge);padding:12px 16px;font-size:20px;line-height:2.4;min-height:7.2em;overflow-wrap:anywhere;
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(2.4em - 2px),var(--ruled) calc(2.4em - 2px),var(--ruled) 2.4em);background-origin:content-box;background-clip:content-box}
.genko .ph{color:#9A9282;border-bottom:2px dashed #B9B09C}
/* 縦書き＝原稿用紙（20マス×列）。1字1マス、書き出し1マスあけ、句読点・」は行頭に来たら前の行の下にぶら下げる */
.genko.tate{background:var(--paper);background-image:none;padding:12px 8px;min-height:0;line-height:1}
.tg-scroll{overflow-x:auto;direction:rtl}
.tg{--cs:clamp(22px,5vw,28px);direction:ltr;display:flex;flex-direction:row-reverse;gap:5px;width:max-content;padding:0 4px calc(var(--cs)*.8)}
.tcol{display:flex;flex-direction:column;border:2px solid #C77B5F}
.tc{position:relative;flex:none;width:var(--cs);height:var(--cs);box-sizing:border-box;border-top:1px solid #E4B5A3;color:var(--ink)}
.tc>b{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:400;font-size:calc(var(--cs)*.74);line-height:1}
.tc i,.hang i{font-style:normal;display:block;line-height:1}
i.pu{transform:translate(.58em,-.58em)}
.hang i.pu{transform:translate(.58em,-.22em)}
i.sm{transform:translate(.1em,-.12em) scale(.9)}
i.rot{transform:rotate(90deg)}
.tc:first-child{border-top:0}
.tc.ph,.hang.ph{color:#A79F8E}
.tc.two>b{font-size:calc(var(--cs)*.46)}
.hang{position:absolute;top:100%;left:0;width:100%;height:calc(var(--cs)*.8);display:flex;flex-direction:column;justify-content:flex-start;align-items:center;font-size:calc(var(--cs)*.74);line-height:1;color:var(--ink)}
.tg-note{font-family:var(--f-pixel);font-size:12px;color:var(--ink-soft);margin:6px 0 0;line-height:1.5}
.genko .fill{color:var(--ink)}
.msg{color:var(--red);font-size:15px;min-height:1.5em;margin:6px 0}
.fixes{margin-top:8px;background:#FFF6D6;border:3px solid var(--edge);padding:6px 10px;font-size:14px;line-height:1.6}
.fixes:empty{display:none}
.fixes b{font-weight:400}
.fixes ul{margin:2px 0 0;padding-left:1.2em}
#craftBtn{width:100%;font-size:22px;padding:12px}

/* わたしのせかい */
.world{position:relative;border:3px solid var(--edge);background:linear-gradient(var(--sky1),var(--sky3));padding:16px 8px 0;overflow:hidden}
.cols{display:grid;grid-template-columns:repeat(10,1fr);align-items:end;min-height:240px}
.col{display:flex;flex-direction:column-reverse}
.col button{border:0;padding:0;background:none;aspect-ratio:1;width:100%;animation:drop .35s ease-out}
.col button svg{width:100%;height:100%}
.col button:hover{filter:brightness(1.15)}
@keyframes drop{from{transform:translateY(-40px);opacity:0}}
.wground{height:34px;margin:0 -8px;background:linear-gradient(var(--grass-l) 0 6px,var(--grass) 6px 16px,var(--dirt) 16px)}
.wempty{position:absolute;inset:16px 16px 50px;display:grid;place-items:center;text-align:center;color:var(--ink);font-size:16px}
.wempty span{background:rgba(255,255,255,.8);padding:8px 14px}
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{display:flex;gap:10px;align-items:center;background:var(--stone);border:3px solid var(--edge);padding:8px 10px;text-align:left;width:100%;box-sizing:border-box}
.witem svg{width:32px;height:32px;flex:none}
.witem span{min-width:0;overflow-wrap:anywhere}

/* モーダル */
.veil{position:fixed;inset:0;z-index:40;background:rgba(10,14,24,.6);display:grid;place-items:center;padding:16px;padding-bottom:max(16px,env(safe-area-inset-bottom,0px))}
.modal{width:min(560px,100%);max-height:88vh;overflow:auto;box-sizing:border-box;display:flex;flex-direction:column;gap:12px;position:relative;animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.mhead{display:flex;gap:12px;align-items:center}
.mhead svg{width:64px;height:64px;flex:none}
.mhead h3{margin:0;font-size:24px;font-weight:400;line-height:1.3}
.x{margin-left:auto;font-size:18px;padding:2px 12px;flex:none}
.cmp{display:flex;flex-direction:column;gap:6px}
.cmp div{display:flex;gap:8px;align-items:flex-start;padding:8px 10px;border:3px solid var(--edge)}
.cmp .a{background:#DADADA;color:var(--ink-soft)}
.cmp .b{background:var(--paper)}
.cmp b{flex:none;font-weight:400;font-size:13px;padding:0 6px;border:2px solid var(--edge);margin-top:4px;line-height:1.6}
.cmp .a b{background:#B5B5B5}
.cmp .b b{background:var(--gold)}
.cmp span{flex:1;min-width:0}
.exs{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px}
.exs li{display:flex;gap:8px;align-items:flex-start;background:var(--paper);border:3px solid var(--edge);padding:6px 10px}
.exs li span{flex:1;min-width:0}
.say{flex:none;width:34px;height:34px;padding:3px;border:3px solid var(--edge);background:var(--gold)}
.say svg{width:100%;height:100%}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row .btn{flex:1}
.center{text-align:center}
.bigblock{width:120px;height:120px;margin:4px auto;animation:spin .6s ease-out}
@keyframes spin{from{transform:scale(.3) rotate(-30deg)}}
.stone{width:160px;height:160px;margin:6px auto;border:0;background:none;padding:0}
.stone svg{width:100%;height:100%}
.stone.hit{animation:shake .15s}
@keyframes shake{25%{transform:translate(-4px,2px)}75%{transform:translate(4px,-2px)}}
.bit{position:absolute;width:12px;height:12px;pointer-events:none;animation:bit .7s ease-out forwards}
@keyframes bit{to{transform:translate(var(--dx),var(--dy)) rotate(200deg);opacity:0}}
.feel{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.feel .btn{width:110px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:13px;padding:8px 4px}
.feel svg{width:36px;height:36px}

/* ===== v4 画面サイズに合わせたレイアウト（ページ全体はスクロールしない） ===== */
html,body{height:100%;min-height:0}
body{overflow:hidden}
.shell{height:100%;display:flex;flex-direction:column}
#start{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden}
#game{flex:1 1 auto;min-height:0;width:100%;max-width:1200px;box-sizing:border-box;padding-block:8px 4px;gap:8px}
#game>.view{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.foot{flex:none;margin:0;max-width:none;width:100%;box-sizing:border-box;padding-block:3px 4px;flex-direction:row;flex-wrap:wrap;justify-content:center;column-gap:14px;font-size:11px}
.foot .verbtn{min-height:32px!important;padding:4px 8px!important;font-size:11px}
.hud{position:relative;flex-wrap:nowrap}
.hud .name{font-size:clamp(17px,4.4vw,24px);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.hud .btn{flex:none;white-space:nowrap}
.hudset{display:flex;gap:8px}
#setBtn{display:none}
@media (max-width:760px){
  #setBtn{display:block}
  .hudset{display:none;position:absolute;right:0;top:calc(100% + 6px);z-index:15;flex-direction:column;align-items:stretch;background:var(--stone);border:3px solid var(--edge);padding:8px;box-shadow:6px 6px 0 rgba(0,0,0,.25)}
  .hudset.open{display:flex}
  .hudset .btn{text-align:left;font-size:15px;padding:8px 12px}
}
.tabs .btn{padding:6px 4px}
/* もちもの */
#vInv{display:flex;flex-direction:column;gap:8px}
.invtop{padding:10px 14px}
#invHelp{margin:0!important}
.inv{grid-template-columns:repeat(6,minmax(0,1fr));gap:6px;align-content:start}
.cell{padding:8px 2px 6px;gap:4px}
.cell svg{width:clamp(34px,7vw,64px);height:clamp(34px,7vw,64px)}
.cell .nm{font-size:clamp(11px,1.5vw,14px);white-space:nowrap}
.cell .sfx{display:none}
@media (max-width:359px){.inv{grid-template-columns:repeat(3,minmax(0,1fr))}}
/* クラフトだい */
.cv{display:flex;flex-direction:column;gap:8px;min-height:100%}
.hotbar button{width:46px;height:46px}
.curname{font-size:17px;line-height:1.3}
.trow{display:flex;align-items:center;gap:10px;padding:8px 10px}
.trow .ttl{margin:0;flex:none;font-size:16px}
.themes{flex-wrap:nowrap;overflow-x:auto;min-width:0;padding-bottom:2px;scrollbar-width:thin}
.themes .btn{flex:none;white-space:nowrap}
.craft{grid-template-columns:minmax(0,1fr) 36px minmax(0,1.25fr);align-items:stretch;flex:1 1 auto;min-height:0}
.arrow{width:36px;height:36px}
.craft>.panel{display:flex;flex-direction:column;min-height:0;padding:10px 14px}
.craft .ttl{font-size:17px;margin:0 0 4px}
.hints{display:flex;flex-wrap:wrap;gap:2px 0;list-style:none;padding:0;margin:0 0 8px;font-size:14px;color:var(--ink-soft)}
.hints li+li::before{content:"／";margin:0 4px;color:#888}
.mat{gap:8px}
.mat label{font-size:13px;margin-bottom:1px}
.mat input{font-size:16px;padding:8px 10px}
.gpanel .genko{flex:1 1 auto;min-height:4.8em;overflow:auto}
.gpanel .gtools{margin-bottom:6px}
.msg{min-height:0;margin:4px 0}
.msg:empty{display:none}
.fixes{margin-top:6px;font-size:13px}
#craftBtn{font-size:20px;padding:10px;margin-top:6px}
.genko.tate{display:flex;flex-direction:column;padding:8px}
.genko.tate .tg-scroll{flex:1 1 auto;min-height:0}
.tg-note{font-size:11px;margin-top:4px}
.cv .craft{align-items:stretch}
.mhd{display:flex;align-items:center;gap:8px}
.mhd .ttl{flex:1}
#hintBtn{display:none;font-size:13px;padding:5px 12px;min-height:32px}
/* わたしのせかい */
.wv{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:10px;height:100%;min-height:0}
.world{display:flex;flex-direction:column;justify-content:flex-end;min-height:0}
.cols{min-height:0;flex:1 1 auto}
.wempty{inset:16px 16px 50px}
.wside{display:flex;flex-direction:column;gap:6px;min-height:0}
.wlist{overflow-y:auto;min-height:0;flex:1 1 auto;padding-right:2px}
@media (max-width:760px){
  .wv{grid-template-columns:1fr;grid-template-rows:minmax(180px,42%) minmax(0,1fr)}
}
/* たてに せまい／スマホ */
@media (max-width:760px){
  #hintBtn{display:block}
  .hints{display:none}
  .cv.showhints .hints{display:flex}
  .tabs .btn{flex-direction:row!important;gap:4px!important;font-size:13px!important;padding:6px 2px}
  .tabs .btn svg{width:18px;height:18px}
  .hotbar{padding:3px}
  .hotbar button{width:42px;height:42px}
  .curname{font-size:15px}
  .trow{padding:6px 8px}
  .trow .ttl{font-size:14px}
  .themes .btn{font-size:13px;padding:3px 8px}
  /* たて書きは スマホでは 全画面の 原稿用紙で 見る */
  .cv.tatemode .gpanel{position:fixed;inset:0;z-index:25;margin:0;border:0;box-shadow:none;

<section id="start">

function conv(s,ruby){const g=S.grade||1,mode=S.furiMode||'cur';let t=g>=3?s.replace(/ /g,''):s;if(ruby)t=esc(t);
  return t.replace(/\[([^|\]]+)\|([^\]]+)\]/g,(_,k,y)=>{
    if(![...k].every(c=>c==='々'||(KG[c]&&KG[c]<=g)))return y;
    if(!ruby)return k;
    const show=mode==='all'||(mode==='cur'&&[...k].some(c=>KG[c]===g));
    return show?`<ruby>${k}<rt>${y}</rt></ruby>`:k})}

function pix(rows,pal,ox=0,oy=0){let s='';rows.forEach((row,y)=>{let x=0;while(x<row.length){const c=row[x];if(!pal[c]){x++;continue}let w=1;while(row[x+w]===c)w++;s+=`<rect x="${x+ox}" y="${y+oy}" width="${w}" height="1" fill="${pal[c]}"/>`;x+=w}});return s}
function cube(c,inner=''){return `<svg class="pixel" viewBox="0 0 12 12" aria-hidden="true"><rect width="12" height="12" fill="${c[0]}"/>${NOISE.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="${c[2]}" opacity=".35"/>`).join('')}<rect width="12" height="1" fill="${c[1]}"/><rect width="1" height="12" fill="${c[1]}"/><rect y="11" width="12" height="1" fill="${c[2]}"/><rect x="11" width="1" height="12" fill="${c[2]}"/>${inner}</svg>`}
const block=id=>{const m=byId(id);return cube(m.c,pix(ICON[id],{w:'#fff',k:'#1E1E1E',y:'#FFD43B'},1,1))};
function stone(stage){let px=[];for(let i=1;i<=stage;i++)px=px.concat(CRACK[i]);return cube(STONE,px.map(([x,y])=>`<rect x="${x}" y="${y}" width="1" height="1" fill="#222"/>`).join(''))}

// 縦書きで形が変わる字は、フォントにたよらず決まった形で出す
const VMAP={'「':'﹁','」':'﹂','『':'﹃','』':'﹄','（':'︵','）':'︶','(':'︵',')':'︶','…':'︙'};
function vchars(t){return [...t].map(ch=>{const c=/[。、．，]/.test(ch)?'pu':/[ぁぃぅぇぉっゃゅょゎァィゥェォッャュョヮ]/.test(ch)?'sm':/[ー〜～－―]/.test(ch)?'rot':'';return `<i class="${c}">${esc(VMAP[ch]||ch)}</i>`}).join('')}
function tateHTML(toks){
  const ROWS=20,tk=[];
  toks.forEach(o=>{if(o.t===' ')return;const pv=tk[tk.length-1];if(pv&&/^[」』]$/.test(o.t)&&/^[。、]$/.test(pv.t)){pv.t+=o.t;return}tk.push({t:o.t,c:o.c})});
  const cols=[[{t:'',c:''}]];let col=cols[0];// 書き出しは1マスあける
  tk.forEach(o=>{
    if(col.length>=ROWS){
      if(/^[。、」』]/.test(o.t)){const last=col[ROWS-1];last.h=(last.h||'')+o.t;last.hc=o.c;return}// 行頭に句読点を置かない
      col=[];cols.push(col)}
    if(/^[「『]/.test(o.t)&&col.length===ROWS-1){col.push({t:'',c:''});col=[];cols.push(col)}// 行末に「を置かない
    col.push(o)});
  const blank=()=>({t:'',c:''});
  cols.forEach(c=>{while(c.length<ROWS)c.push(blank())});
  while(cols.length<8)cols.push(Array.from({length:ROWS},blank));
  return `<div class="tg-scroll"><div class="tg">${cols.map(c=>`<div class="tcol">${c.map(x=>`<div class="tc ${x.c}${x.t.length>1?' two':''}"><b>${vchars(x.t)}</b>${x.h?`<span class="hang ${x.hc||''}">${vchars(x.h)}</span>`:''}</div>`).join('')}</div>`).join('')}</div></div><p class="tg-note">げんこうようしの きまり：さいしょは 1マス あける／1マスに 1字（小さい字や 。、も 1マス）／。や 、が ぎょうの さいしょに きたら、まえの ぎょうの いちばん下に いれる</p>`;
}
// 小学生によくある 誤字の辞書（まちがいと 確実に いえる 形だけ）
const TB='(?=[、。！？!? 　]|$)';
const PRON='ぼくたち|わたしたち|ぼくら|ぼく|わたし|おれ|みんな|きょう|今日|きのう|昨日|あした|明日|これ|それ|あれ|ここ|そこ|あそこ|先生|せんせい|お母さん|お父さん|おかあさん|おとうさん|弟|妹|兄|姉|友だち|ともだち|家族|かぞく';
const PLACE='学校|がっこう|家|いえ|公園|こうえん|海|うみ|山|やま|川|かわ|駅|えき|図書館|としょかん|お店|おみせ|教室|きょうしつ|体育館|たいいくかん|プール|お寺|おてら|神社|じんじゃ|病院|びょういん';
const TYPO=[
 [/きのお(?=[、。！？!? 　はわもの]|$)/g,'きのう'],
 [/おとおさん/g,'おとうさん'],[/おとおと/g,'おとうと'],[/いもおと/g,'いもうと'],[/おねいさん/g,'おねえさん'],[/おねいちゃん/g,'おねえちゃん'],
 [/せんせえ/g,'せんせい'],[/ありがとお(?=[ごうと、。！？!? 　」]|$)/g,'ありがとう'],[/おはよお(?=[ごうと、。！？!? 　」]|$)/g,'おはよう'],
 [/こんにちわ/g,'こんにちは'],[/こんばんわ/g,'こんばんは'],[/とおもろこし/g,'とうもろこし'],[/ぼおし/g,'ぼうし'],
 [/ほんとお(?=[にのはう、。！？!?]|$)/g,'ほんとう'],[/とうり(?=[をにがはでだと、。！？!? 　]|$)/g,'とおり'],
 [/おうき([いなくさ])/g,'おおき$1'],[/とうい(?=[、。！？!? 　]|ところ|です|$)/g,'とおい'],[/とうく(?=[、。にへのまからで]|$)/g,'とおく'],[/おうい(?=[、。！？!? 　]|です|$)/g,'おおい'],
 [/(^|[^こ])づつ/g,'$1ずつ'],[/つず([くきけいか])/g,'つづ$1'],[/ちかず([くきけいか])/g,'ちかづ$1'],[/ちじむ/g,'ちぢむ'],
 [/はなじ(?=[がをはも、。]|$)/g,'はなぢ'],[/みかずき/g,'みかづき'],[/こずつみ/g,'こづつみ'],[/気ず([くきけいか])/g,'気づ$1'],
 [/とゆう/g,'という'],[/ってゆう/g,'っていう'],[/ゆわれ/g,'いわれ'],
 [new RegExp('('+PRON+')わ(?=[、 　「]|$|[一-龯ァ-ヶ])','g'),'$1は'],
 [new RegExp('('+PLACE+')え(?=[、 　]|$|行|い[くっきけこ]|向|むか|帰|かえ|も)','g'),'$1へ'],
 [/(でした|ました|です|ます)\1/g,'$1'],[/([たでだ])\1(?=[。、！？!?]|$)/g,'$1'],
 // 漢字の変換ミス（同じ読みの別の字）。前後の言葉で はっきり わかる 形だけ
 [/始めて(?=の|[見知会行聞食乗来作言書読]|[、 　]|$)/g,'初めて'],
 [/(^|[、。 　はがもでの])以外と/g,'$1意外と'],
 [/目が会/g,'目が合'],[/気が会/g,'気が合'],[/間に会/g,'間に合'],[/話し会/g,'話し合'],[/力を会わせ/g,'力を合わせ'],[/助け会/g,'助け合'],[/教え会/g,'教え合'],
 [/足が早/g,'足が速'],[/早く走/g,'速く走'],[/走るのが早/g,'走るのが速'],[/スピードが早/g,'スピードが速'],[/速く起/g,'早く起'],[/朝速/g,'朝早'],[/速起き/g,'早起き'],
 [/写真を取/g,'写真を撮'],
 [/(身長|長さ|高さ|深さ)を[計量]/g,'$1を測'],[/(体重|重さ)を[計測]/g,'$1を量'],[/(時間|タイム)を[測量]/g,'$1を計'],
 [/(病気|けが|ケガ|かぜ|風邪|きず|傷)(を|が)直/g,'$1$2治'],
 [/自身(が[つあな]|を持|をも)/g,'自信$1'],
 [/関心(し[たてま])/g,'感心$1'],
 [/薬が聞/g,'薬が効'],
 [/(家|うち|いえ)(に|へ)返/g,'$1$2帰'],
 [/(駅|学校|家|うち|いえ|公園|会場|ゴール|頂上|ちょうじょう|目的地)に付/g,'$1に着'],
 [/(山|木|やま|き)に上/g,'$1に登'],
 [/連習/g,'練習'],[/一諸/g,'一緒']
];
function fixTypos(t,rec){TYPO.forEach(([re,to])=>{t=t.replace(re,(...a)=>{const m=a[0];const r=m.replace(new RegExp(re.source,re.flags.replace('g','')),to);if(r!==m){const cut=/づつ$/.test(m)?m.length-2:0;rec(m.slice(cut),r.slice(cut))}return r})});return t}
// ざいりょうと決まった言葉をつなぐ。つなぎ目でかさなった言葉（「公園でで」など）は自動でなおす
function compose(){
  const m=byId(C.m),parts=[],fixes=[];let k=0;
  m.tpl.forEach(p=>{if(typeof p==='string'){parts.push({f:1,r:p,t:K(p)});return}
    const v=(C.v[k++]||'').replace(/^[\s　]+|[\s　]+$/g,'');
    parts.push(v?{s:1,t:v}:{ph:1,ex:exOf(p),t:''})});
  const add=(a,b)=>{if(a!==b&&!fixes.some(f=>f[0]===a))fixes.push([a,b])};
  parts.forEach(x=>{if(!x.s)return;const o=x.t;
    x.t=x.t.replace(/[ 　]{2,}/g,'　').replace(/([。、])\1+/g,'$1').replace(/、。|。、/g,'。').replace(/(を|が|で)\1/g,'$1');
    if(x.t!==o)add(o,x.t);
    x.t=fixTypos(x.t,(a,b)=>add(a,b))});
  if(m.id==='onoma'&&parts[0].s&&!/[。！？!?、]$/.test(parts[0].t))parts[0].t+='。';
  parts.forEach((x,i)=>{if(!x.s)return;const pv=parts[i-1],nx=parts[i+1];
    if(nx&&nx.f){const f=nx.t;let hit=false;
      for(let n=Math.min(5,f.length,x.t.length-1);n>=1;n--){const o=f.slice(0,n);if(x.t.endsWith(o)){add(x.t+o,x.t.slice(0,-n)+o);x.t=x.t.slice(0,-n);hit=true;break}}
      if(!hit&&/^[。、]/.test(f)&&/[。、]$/.test(x.t)){add(x.t+f[0],x.t.slice(0,-1)+f[0]);x.t=x.t.slice(0,-1)}
      if(/^。/.test(f)&&/[！？!?]$/.test(x.t)){add(x.t+'。',x.t);nx.t=f.slice(1);nx.cut=1}}
    if(pv&&pv.f){const f=pv.t;
      for(let n=Math.min(6,f.length,x.t.length-1);n>=1;n--){const o=f.slice(-n);if(x.t.startsWith(o)){add(o+x.t,o+x.t.slice(n));x.t=x.t.slice(n);break}}}});
  return {parts,fixes}}
// たて書きのマスを、原稿用紙の入れものの高さに合わせる
function fitTate(){const g=$('#genko'),tg=g&&g.querySelector('.tg');if(!tg)return;
  const sc=g.querySelector('.tg-scroll'),note=g.querySelector('.tg-note');
  const h=g.clientHeight-16-(note?note.offsetHeight+4:0);
  const cs=Math.max(16,Math.min(36,Math.floor((h-4)/20.8-.5)));tg.style.setProperty('--cs',cs+'px')}
if(window.ResizeObserver)new ResizeObserver(()=>{if(C.tate)fitTate()}).observe(document.getElementById('genko'));
function renderGenko(){
  const {parts,fixes}=compose();
  if(C.tate){const toks=[];parts.forEach(x=>{if(x.ph)[...K(x.ex)].forEach(t=>toks.push({t,c:'ph'}));else [...x.t].forEach(t=>toks.push({t,c:''}))});$('#genko').innerHTML=tateHTML(toks);fitTate()}
  else $('#genko').innerHTML='　'+parts.map(x=>x.f?(x.cut?esc(x.t):R(x.r)):x.s?`<span class="fill">${esc(x.t)}</span>`:`<span class="ph">${R(x.ex)}</span>`).join('');
  $('#fixes').innerHTML=fixes.length?`<b>じどうで なおしたよ（ノートに 書くときも 気をつけよう）</b><ul>${fixes.slice(0,4).map(([a,b])=>`<li>「${esc(a)}」→「${esc(b)}」</li>`).join('')}</ul>`:'';
}

const nest=(svg,x,y,s)=>svg.replace('<svg ',`<svg x="${x}" y="${y}" width="${s}" height="${s}" `);

const paper=(x,y,l)=>`<rect x="${x}" y="${y}" width="10" height="13" fill="#1D1D1D"/><rect x="${x+1}" y="${y+1}" width="8" height="11" fill="#FBF7EC"/>${l?[3,6,9].map(d=>`<rect x="${x+2}" y="${y+d}" width="6" height="1" fill="#B5B5B5"/>`).join(''):''}`;
const pencil=[[22,13],[23,12],[24,11],[25,10],[26,9]].map(([x,y])=>`<rect x="${x}" y="${y}" width="2" height="2" fill="#FFD43B"/>`).join('')+'<rect x="21" y="14" width="2" height="1" fill="#C9A06A"/><rect x="21" y="15" width="1" height="1" fill="#1D1D1D"/><rect x="27" y="8" width="2" height="2" fill="#E05A7E"/>';

let sp=0,sDone=null;
function showStory(done){sp=0;sDone=done;$('#story').hidden=false;renderStory()}
function renderStory(){const st=STORY[sp],last=sp===STORY.length-1;
  $('#scene').innerHTML=st.s();
  const t=$('#stext');t.style.animation='none';void t.offsetWidth;t.style.animation='';
  t.innerHTML=`<p style="margin:0">${R(st.p)}</p>${st.ul?`<ul class="slist">${st.ul.map(x=>`<li>${R(x)}</li>`).join('')}</ul>`:''}${st.end?`<p style="margin:4px 0 0">${R(st.end)}</p>`:''}`;
  $('#sdots').innerHTML=STORY.map((_,i)=>`<i class="${i===sp?'on':''}"></i>`).join('');
  $('#sNext').innerHTML=last?'はじめる ▶':'つぎへ ▶';$('#sSkip').hidden=last;
  $('#sNo').setAttribute('aria-pressed',!!S.noStory)}
function endStory(){$('#story').hidden=true;const d=sDone;sDone=null;if(d)d()}
$('#sNext').onclick=()=>{tap();if(sp===STORY.length-1){fanfare();endStory()}else{sp++;renderStory()}};
$('#sSkip').onclick=()=>{tap();endStory()};
$('#sNo').onclick=()=>{tap();S.noStory=!S.noStory;save();$('#sNo').setAttribute('aria-pressed',S.noStory)};
$('#storyBtn').onclick=()=>{tap();showStory(null)};

];
let hp=0;
function showHelp(){hp=0;renderHelp()}
function renderHelp(){const h=HELP[hp],last=hp===HELP.length-1;
  openModal(`<div class="mhead">${h.ic?`<span class="hic">${TAB[h.ic]}</span>`:''}<div><div class="small">つかいかた ${hp+1} / ${HELP.length}</div><h3>${R(h.h)}</h3></div><button class="btn x" type="button" aria-label="とじる">×</button></div>
   ${h.p?h.p.map(x=>`<p style="margin:0">${R(x)}</p>`).join(''):''}
   ${h.ol?`<${h.ul?'ul':'ol'} class="hol">${h.ol.map(x=>`<li>${R(x)}</li>`).join('')}</${h.ul?'ul':'ol'}>`:''}
   <div class="row"><button class="btn" type="button" id="hPrev" ${hp===0?'disabled':''}>◀ まえ</button><button class="btn green" type="button" id="hNext">${last?'はじめる':'つぎへ ▶'}</button></div>
   <button class="btn chkbtn" type="button" id="hNo" aria-pressed="${!!S.noHelp}"><span class="chk"></span>つぎから ひょうじしない</button>`);
  $('#hPrev').onclick=()=>{tap();if(hp>0){hp--;renderHelp()}};
  $('#hNext').onclick=()=>{tap();if(last)closeModal();else{hp++;renderHelp()}};
  $('#hNo').onclick=()=>{tap();S.noHelp=!S.noHelp;save();$('#hNo').setAttribute('aria-pressed',S.noHelp)};
}
$('#helpBtn').onclick=()=>{tap();showHelp()};
function intro(){const help=()=>{if(!S.noHelp)showHelp()};if(!S.noStory)showStory(help);else help()}
